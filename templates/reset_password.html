{% extends "base.html" %}{% block content %}<section class="auth card"><div class="symbol">✦</div><h1>Create new password</h1><p class="muted">Choose a strong password with at least 8 characters.</p><form method="post"><label>New password</label><div class="password"><input id="new-password" type="password" name="password" minlength="8" required autocomplete="new-password"><label class="show"><input type="checkbox" onclick="document.getElementById('new-password').type=this.checked?'text':'password';document.getElementById('confirm-password').type=this.checked?'text':'password'"> Show</label></div><label>Confirm password</label><input id="confirm-password" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"><button class="primary wide">Change password</button></form></section>{% endblock %}
