<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizMind AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><nav><a class="brand" href="{{ url_for('home') }}">✦ QuizMind AI</a><div>{% if session.get('user_id') %}<a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('logout') }}">Logout</a>{% endif %}</div></nav>
<main>{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Learn something new, one quiz at a time.</footer></body></html>
